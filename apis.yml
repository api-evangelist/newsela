aid: newsela
name: Newsela
description: >-
  Newsela is a K-12 content and assessment platform that provides
  research-backed, engaging, differentiated reading content and AI-powered
  tools across ELA, social studies, STEM, and writing to support educators
  and drive student growth in grades 3-12. Newsela publishes no public
  developer API; it integrates with school systems as a certified 1EdTech
  (IMS Global) product supporting OneRoster 1.1 rostering, LTI v1.3 launch,
  and Data Privacy certification, and handles student data under FERPA, COPPA,
  and state student-privacy laws. Added to the API Evangelist network as a
  techstars portfolio company.
